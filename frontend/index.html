<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Monkey Garage - Inicio de sesión</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="assets/css/comun.css">
        <link rel="stylesheet" href="assets/css/cliente.css">
    </head>
    <body>
    <div class="pagina">
        <div class="panel-izquierdo">
            <img src="assets/img/imagen-izquierda-login.jpg" alt="Equipo de Monkey Garage junto a un coche clásico naranja">
            <h1>Arranca motores</h1>
            <p>Pisa a fondo y entra al garage</p>
        </div>

        <div class="fondo-derecho">
            <div class="tarjeta-login">
                <img src="assets/img/logo.png" alt="Logo Monkey Garage">
                <h2>Inicio Sesión</h2>
                <form>
                    <input type="text" placeholder="Correo electrónico">
                    <input type="password" placeholder="Contraseña">
                    <div id="errores"></div>
                    <button type="button">Iniciar Sesión</button>
                </form>
                <a href="#">¿Olvidaste la contraseña?</a>
                <a href="registro/index.html">Regístrate</a>
            </div>
        </div>
    </div>
</body>
</html>
