<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Monkey Garage - Recuperar contraseña</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../assets/css/comun.css">
        <link rel="stylesheet" href="../assets/css/cliente.css">
    </head>
    <body class="recuperar">
        <div class="pagina">
            <div class="panel-izquierdo">
                <h1>Arranca motores</h1>
                <p>Pisa a fondo y entra al garage</p>
            </div>

            <div class="fondo-derecho">
                <div class="tarjeta-login">
                    <img src="../assets/img/logo.png" alt="Logo Monkey Garage">
                    <h2>Recuperar Contraseña</h2>
                    <p>Introduce tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña</p>
                    <form>
                        <input type="email" placeholder="Correo electrónico">
                        <div class="errores"></div>
                        <button type="button">Enviar enlace</button>
                    </form>
                    <a href="../">Volver al inicio de sesión</a>
                </div>
            </div>
        </div>
    </body>
</html>
